<!-- screen/reset-set-new -->
<main data-screen="screen/reset-set-new">
  <h1>Set a new password</h1>
  <form>
    <input data-oid="reset-set-new/new-password" data-handler="onNewPasswordInput" type="password" name="new-password" placeholder="New password">
    <button data-oid="reset-set-new/password-visibility" data-handler="onTogglePasswordVisibility" type="button">Show</button>
    <input data-oid="reset-set-new/confirm-password" data-handler="onConfirmPasswordInput" type="password" name="confirm-password" placeholder="Confirm new password">
    <button data-oid="reset-set-new/update-password" data-handler="submitUpdatePassword" type="submit">Update password</button>
  </form>
</main>
