<!-- screen/reset-request -->
<main data-screen="screen/reset-request">
  <h1>Reset your password</h1>
  <form>
    <input data-oid="reset-request/email" data-handler="onEmailInput" type="email" name="email" placeholder="Work email">
    <button data-oid="reset-request/send-reset" data-handler="submitSendReset" type="submit">Send reset link</button>
    <a data-oid="reset-request/back-to-sign-in" data-handler="goToLogin" href="#/login">Back to sign in</a>
  </form>
</main>
